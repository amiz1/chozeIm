<style>
:root{--ink:#2B2B2B;--olive:#5E6A41;--olive-l:#7E8C5A;--clay:#9C6B4F;--gold:#B08A3E;--paper:#FAF9F5;--card:#FFFFFF;--rule:#DCD7CA;--mute:#6E6A5F;--tint:#F4F5EF;--tint2:#FAFAF6;--claybg:#FBF6F2;
--display:'Frank Ruhl Libre','David Libre',Georgia,serif;--body:'Assistant','Segoe UI',system-ui,sans-serif;}
:root[data-theme="dark"]{--ink:#ECE9E1;--paper:#1E1F1A;--card:#282A23;--rule:#44463C;--mute:#B3AE9F;--tint:#2F3327;--tint2:#24261F;--claybg:#33291F;--olive:#A9B77F;--olive-l:#8E9C63;--clay:#D09A77;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px}
header.brand{text-align:center;padding:26px 0 10px}
.wordmark{font-family:var(--display);color:var(--clay);font-size:20px;letter-spacing:.5px}
h1{font-family:var(--display);color:var(--olive);font-size:40px;margin:6px 0 4px;font-weight:700;line-height:1.2}
.sub{color:var(--mute);font-size:17px;padding-bottom:14px;border-bottom:2px solid var(--gold);display:inline-block}
h2{font-family:var(--display);color:var(--olive);font-size:28px;margin:0 0 6px;padding-bottom:6px;border-bottom:1.5px solid var(--gold)}
h3{font-family:var(--display);color:var(--clay);font-size:21px;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;margin:18px 0}
.tintbox{background:var(--tint);border-right:4px solid var(--olive);border-radius:6px;padding:16px 20px;margin:18px 0}
.claybox{background:var(--claybg);border-right:4px solid var(--clay);border-radius:6px;padding:14px 18px;margin:12px 0}
.muted{color:var(--mute)} .small{font-size:15px}
label.f{display:block;font-weight:600;color:var(--olive);margin:12px 0 4px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--tint2);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--olive-l);border-color:var(--olive-l)}
.q{margin:26px 0 8px}
.q.unsure{border-right:3px solid var(--clay);padding-right:12px}
.q.unsure .qt::after{content:'  · כדאי לבדוק מול הטופס';color:var(--clay);font-weight:600;font-size:14px}
.qt{font-weight:700;font-size:19px;margin-bottom:4px}
.qt .n{color:var(--olive);margin-left:6px}
.qn{color:var(--mute);font-style:italic;font-size:15.5px;margin-bottom:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;margin:7px 0;background:var(--card);cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--olive-l)}
.opt.on{background:var(--tint);border-color:var(--olive)}
.opt.dis{opacity:.45;cursor:not-allowed}
.mk{flex:0 0 22px;height:22px;border:2px solid var(--olive);margin-top:3px;display:flex;align-items:center;justify-content:center;background:var(--card)}
.mk.r{border-radius:50%} .mk.c{border-radius:4px}
.opt.on .mk.r::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--olive)}
.opt.on .mk.c{background:var(--olive)} .opt.on .mk.c::after{content:"✓";color:#fff;font-size:14px;line-height:1}
.scale{display:flex;gap:8px;margin-top:8px}
.scale button{flex:1;font:inherit;font-weight:700;font-size:19px;padding:12px 0;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--olive);cursor:pointer}
.scale button.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.ends{display:flex;justify-content:space-between;font-size:14.5px;color:var(--mute);margin-top:4px}
.follow{margin:8px 26px 0 0;padding:10px 14px;border-right:3px solid var(--clay);background:var(--claybg);border-radius:4px}
.follow label{font-weight:600;color:var(--clay);font-size:15.5px;display:block;margin:6px 0 3px}
.follow input{max-width:180px}
.othertxt{margin:4px 36px 6px 0}
.limit{color:var(--clay);font-size:15px;min-height:1.2em}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.btn{font:inherit;font-weight:700;font-size:17px;padding:12px 26px;border-radius:8px;border:none;background:var(--olive);color:#fff;cursor:pointer}
.btn:hover{background:#4f5936}
.btn.ghost{background:transparent;color:var(--olive);border:1.5px solid var(--olive)}
.btn.clay{background:var(--clay)}
.prog{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.progl{font-size:14px;color:var(--mute);text-align:left}
.codebox{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;direction:ltr;text-align:left;word-break:break-all;background:var(--tint2);border:1px dashed var(--olive-l);padding:12px;border-radius:6px;max-height:120px;overflow:auto}
.reflect p{margin:0 0 14px}
.reflect h3{margin-top:22px}
.saved{font-size:13.5px;color:var(--mute);text-align:center;margin-top:18px}
/* consultant */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid3{grid-template-columns:1fr}.follow{margin-right:0}}
.col{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px}
.col h4{margin:0 0 10px;font-family:var(--display);color:var(--olive);font-size:18px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.tool{margin:0 0 12px}
.tool b{display:block}
.why{display:inline-block;font-size:13px;background:var(--tint);color:var(--olive);border-radius:10px;padding:1px 8px;margin:3px 0 0 4px}
.why.x{background:var(--claybg);color:var(--clay)}
table.kv{width:100%;border-collapse:collapse;font-size:16px}
table.kv td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.kv td:first-child{color:var(--mute);width:38%}
.sig{border-right:4px solid var(--gold);background:#fff;border:1px solid var(--rule);border-right-width:4px;border-radius:6px;padding:10px 14px;margin:8px 0}
.sig.t{border-right-color:var(--clay)}
.sig b{color:var(--olive)} .sig.t b{color:var(--clay)}
.tabs{display:flex;gap:6px;margin:18px 0 0;border-bottom:1.5px solid var(--rule)}
.tabs button{font:inherit;font-weight:600;border:none;background:none;padding:8px 14px;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button.on{color:var(--olive);border-bottom-color:var(--gold)}
.hide{display:none}
.sel{font:inherit;font-size:15px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--tint2);color:var(--ink)}
@media print{.nav,.tabs,.noprint{display:none!important}.hide{display:block!important}body{background:#fff}.card{break-inside:avoid}}
.grow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}.grow .gl{flex:1 1 220px;font-weight:600}.grow input{flex:1 1 220px}.gseg{display:flex;gap:6px;flex:1 1 280px}.gseg button{flex:1;font:inherit;font-size:15px;padding:9px 6px;border:1px solid var(--rule);background:var(--card,#fff);color:inherit;border-radius:6px;cursor:pointer}.gseg button.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.q.tb{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin:10px 0}.q.tb .qt{font-size:17px}.q.tb .opt{display:inline-flex;margin:4px 0 4px 6px;padding:7px 12px}.q.tb+.q.tb{margin-top:-11px;border-top:1px dashed var(--rule);border-radius:0 0 10px 10px}.q.tb:has(+.q.tb){border-bottom-left-radius:0;border-bottom-right-radius:0}.tbh{font-weight:700;color:var(--olive);font-size:19px;margin:0 0 8px}</style>
<style>#cwlR{position:fixed;inset:0;background:rgba(20,20,15,.55);display:flex;align-items:flex-start;justify-content:center;z-index:9999;overflow:auto;padding:24px 14px;direction:rtl}
 #cwlR .bx{background:#fff;color:#2B2B28;max-width:520px;width:100%;border-radius:10px;border-top:5px solid #B8933F;padding:22px 20px;font-family:"Assistant","Heebo","Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.6}
 #cwlR h3{margin:0 0 6px;font-size:22px;color:#4E5A3A}#cwlR p{margin:0 0 10px}
 #cwlR input,#cwlR textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #DAD5C7;border-radius:6px;margin:4px 0 12px;box-sizing:border-box;background:#fff;color:#2B2B28}
 #cwlR textarea{font-size:13px;height:90px;direction:rtl}
 #cwlR .b{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;border-radius:6px;padding:12px 16px;cursor:pointer;border:1px solid #6B7A4F;width:100%;margin:0 0 8px;box-sizing:border-box}
 #cwlR .pr{background:#6B7A4F;color:#fff}#cwlR .gh{background:#fff;color:#4E5A3A}#cwlR .x{background:none;border:0;color:#6E6B62;text-decoration:underline;padding:4px;font:inherit;cursor:pointer}
 #cwlR .m{font-size:15px;color:#4E5A3A;font-weight:600;min-height:1.4em}#cwlR small{color:#6E6B62;font-size:14px}
 #cwlThanks{position:fixed;inset:0;background:#F6F4EE;z-index:10000;display:flex;align-items:center;justify-content:center;padding:24px 18px;direction:rtl;overflow:auto}
 #cwlThanks .tx{max-width:520px;text-align:center;font-family:Arial,"Arial Hebrew",sans-serif;color:#2A2A26;font-size:22px;line-height:1.6}
 #cwlThanks h2{font-size:34px;color:#4E5A3A;margin:14px 0 12px}#cwlThanks p{margin:0 0 6px}
 #cwlThanks button{margin-top:30px;font:inherit;font-size:16px;background:none;border:0;color:#6C6A61;text-decoration:underline;cursor:pointer}
 .cwl-send{font:inherit;font-weight:700;background:#B8933F;color:#fff;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;margin:6px 0}
 @media print{.cwl-send,#cwlR{display:none!important}}</style></head>

<script>
const MODE='client'; // client | yoetz
const Q={"meta": {"title": "שאלון הכניסה 02", "wordmark": "חוזה עם החיים", "sub": "למילוי עצמי לפני הפגישה הראשונה", "purposeTitle": "לפני שמתחילים", "purpose": "השאלון הזה הוא הצעד הראשון שלנו יחד. הוא עוזר לנו להכיר את המקום שממנו את/ה יוצא/ת לדרך: באיזה שלב בחיים את/ה נמצא/ת, מה הביא אותך לעצור דווקא עכשיו, איזה מקום תופסת העבודה בחייך, ומה עוד מבקש בירור. אין כאן תשובות נכונות או לא נכונות, ואף תשובה לא תחליט במקומך. כל מה שנדרש הוא לענות בכנות, כפי שהדברים נראים לך היום.", "time": "בשאלות הפתוחות מספיקות כמה מילים, ואם יש לך יותר לומר, נשמח לקרוא."}, "sections": [{"id": "A", "title": "א. שלב החיים והצומת", "qs": [{"id": "q1", "n": 1, "tbl": "איפה אני היום", "type": "single", "text": "השלב שלי במסע המקצועי", "opts": ["בתחילת הדרך המקצועית", "בשלב של התבססות ובנייה מקצועית", "בשלב בשל במסע המקצועי – עם ניסיון, הישגים וזהות מקצועית מגובשת", "בשלב של בחינה מחדש באמצע המסע המקצועי", "לקראת פרישה או צמצום משמעותי של העבודה", "אחרי פרישה, ובונה פרק חדש"]}, {"id": "q1w", "n": "", "key": "1ב", "tbl": 1, "type": "single", "text": "איך נראית העבודה שלי היום", "opts": ["מקום עבודה אחד", "עצמאי/ת", "כמה עבודות במקביל", "כרגע לא עובד/ת"], "follow": {"when": 2, "label": "", "fields": [{"id": "q1w_t", "label": "אילו עבודות? (למשל: עורכת דין, צלמת)", "txt": true}]}}, {"id": "q1r", "n": "", "key": "1ג", "tbl": 1, "type": "single", "text": "האם פרישה בתמונה?", "opts": ["לא בתכנון", "בעוד כמה שנים", "בשנה–שנתיים הקרובות", "כבר פרשתי"]}, {"id": "q2", "n": 2, "type": "multi", "max": 2, "text": "מה מתאר את המצב שלך בצומת הנוכחית?", "note": "בחר/י עד שני משפטים שהכי קרובים למה שקורה לך עכשיו. ואם אף אחד מהם לא מדייק, נשמח לשמוע את זה במילים שלך.", "other": 9, "otherLine": true, "opts": ["אני מרגיש/ה שמשהו צריך להשתנות, ועדיין אין לי כיוון", "יש לי כמה אפשרויות או כיוונים שאני רוצה לבדוק", "עומדות לפניי שתי חלופות ממשיות או יותר, ואני צריך/ה לבחור ביניהן", "יש לי כיוון ברור למדי, וקשה לי לעשות את הצעד הבא", "יש לי הישגים או יציבות מקצועית, והעבודה פחות מתאימה לי היום", "אני יזמתי עזיבה או שינוי מקצועי, ואני לקראת המעבר או כבר בתוכו", "אני מתמודד/ת עם שינוי שנכפה עליי: פיטורים, סגירת תפקיד או שינוי ארגוני", "אני עובר/ת שינוי של שלב חיים, ובוחן/ת איך ייראה הפרק הבא", "כבר עשיתי שינוי, ואני בודק/ת מה מתאים לי כעת", "אחר:"], "orderA": [7, 8, 0, 1, 2, 3, 4, 5, 6, 9], "orderL": [7, 5, 0, 1, 3, 2, 4, 6, 8, 9]}, {"id": "q2p", "n": "", "key": "2ב", "type": "scale", "text": "עד כמה אני מזדהה עם המקצוע שלי?", "note": "מקצוע הוא מה שלמדת או עסקת בו לאורך זמן (למשל עריכת דין, הוראה, הנדסה), ולא דווקא התפקיד הנוכחי.", "lo": "כמעט לא", "hi": "מאוד"}, {"id": "q2c", "n": "", "key": "2ג", "type": "single", "text": "האם יש בחייך עיסוק נוסף, מחוץ לעבודה, שחשוב לך?", "note": "למשל תחביב מפותח, יצירה, אמנות, ספורט, התנדבות קבועה או לימודים.", "opts": ["כן, והוא מרכזי בחיי: אני משקיע/ה בו הרבה זמן ואנרגיה", "יש לי עיסוק כזה, אבל הוא לא מרכזי", "לא ממש. רוב החיים שלי סובבים סביב העבודה"], "follow": {"when": [0, 1], "label": "", "fields": [{"id": "q2c_t", "label": "מה הוא?", "txt": true}]}, "textA": "מה ממלא היום את החיים שלך, מעבר לבית ולמשפחה?", "noteA": "למשל יצירה, התנדבות, לימודים, ספורט, פרויקט או תחום עניין.", "optsA": ["משהו מרכזי, שאני משקיע/ה בו הרבה זמן ואנרגיה", "יש דברים כאלה, אבל הם עוד לא ממלאים אותי", "עדיין לא מצאתי. זה חלק ממה שאני מחפש/ת"]}, {"id": "q3", "n": 3, "type": "single", "text": "מתי התחיל השינוי או ההתלבטות שמביאים אותך לכאן?", "opts": ["פחות מחודש", "חודש עד שלושה חודשים", "שלושה חודשים עד שנה", "יותר משנה"], "showIf": {"path": "main"}}, {"id": "q4", "n": 4, "type": "scale", "text": "עד כמה יש דחיפות לקבל החלטה או לעשות שינוי עכשיו?", "lo": "כמעט אין דחיפות", "hi": "דחוף מאוד", "showIf": {"path": "main"}}, {"id": "q5", "n": 5, "type": "single", "text": "כשאת/ה חושב/ת על שינוי מקצועי, עד כמה יש לך מרחב זמן לבחון אפשרויות לפני שתצטרך/י להגיע להחלטה מעשית?", "opts": ["אני זקוק/ה להחלטה בזמן הקרוב – עד כשלושה חודשים", "יש לי כמה חודשים לבחון אפשרויות", "יש לי מרחב של שנה או יותר לבירור ולניסוי", "אין כרגע מגבלת זמן משמעותית", "קשה לי להעריך בשלב let SAMPLE=null,LIM=null,scanCtl=null;
async function initSample(){
  try{if(!window.claude||!window.claude.use)return;const s=await window.claude.use('sample');if(!s)return;
    const l=await s.limits().catch(()=>null);if(!l||!l.images)return;SAMPLE=s;LIM=l;const c=$('scanCard');if(c)c.hidden=false;}catch(e){}
}
function formSpec(){
  const L=[];
  Q.sections.forEach(s=>{L.push('## '+s.title);s.qs.forEach(q=>{
    let head=`${q.id} [${q.type}${q.max?', up to '+q.max:''}${q.showIf?', only if '+JSON.stringify(q.showIf):''}] ${q.n?q.n+'. ':''}${q.text}`;
    L.push(head);
    if(q.opts)q.opts.forEach((o,i)=>L.push(`   ${i} = ${o}`));
    if(q.type==='scale')L.push(`   value 1..5 (1 = ${q.lo}, 5 = ${q.hi})`);
    if(q.other!=null)L.push(`   free text for option ${q.other} goes in t.${q.id}_o`);
    if(q.type==='open')L.push(`   handwritten text goes in t.${q.id}`);
    if(q.follow)q.follow.fields.forEach(f=>L.push(`   if ${q.id} in [${[].concat(q.follow.when)}]: t.${f.id} = "${f.label}"`));
  });});
  return L.join('\n');
}
function scanPrompt(k,n){
  return `You are reading ${n>1?`part ${k+1} of ${n} of `:''}photos or scans of a filled-in Hebrew paper questionnaire ("${Q.meta.title}"). The pages are right-to-left. Each answer option has a checkbox (☐) at the right side of its row; a marked option has an X, a check mark, a circle, or a filled box. Scale questions (q4, q17) show rows "1" to "5". The cover page has handwritten fields: שם (name), גיל (age), שנות ניסיון מקצועי (years of professional experience), תאריך מילוי (date).

Read ONLY what is on these pages. Do not guess missing answers: leave a question out if it is not on these pages or not marked. Transcribe handwriting in Hebrew exactly as written. If a mark or handwriting is ambiguous, still give your best reading AND add the question id to "unsure".

The questionnaire (question id [type] text, then option index = option text):
${formSpec()}

Reply with only this JSON (omit keys you did not find):
{"name":"","age":"","years":"","date":"","a":{"q1":3,"q2":[0,4],"q4":4},"t":{"q8":"..."},"unsure":["q7"]}
single = one option index; multi = array of option indices; scale = number 1-5.`;
}
function cleanScan(r){
  const out={name:'',age:'',years:'',date:'',a:{},t:{},unsure:[]};if(!r||typeof r!=='object')return out;
  ['name','age','years','date'].forEach(k=>{if(r[k]!=null)out[k]=String(r[k]).slice(0,80)});
  const a=r.a||{},tt=r.t||{};
  allQs.forEach(q=>{const v=a[q.id];if(v==null)return;
    if(q.type==='single'){const i=parseInt(v);if(i>=0&&i<q.opts.length)out.a[q.id]=i;}
    if(q.type==='scale'){const i=parseInt(v);if(i>=1&&i<=5)out.a[q.id]=i;}
    if(q.type==='multi'&&Array.isArray(v)){let arr=[...new Set(v.map(x=>parseInt(x)).filter(i=>i>=0&&i<q.opts.length))].sort((x,y)=>x-y);if(q.max&&arr.length>q.max){arr=arr.slice(0,q.max);out.unsure.push(q.id);}out.a[q.id]=arr;}
  });
  const ok=new Set(allQs.flatMap(q=>[q.id,q.id+'_o',...(q.follow?q.follow.fields.map(f=>f.id):[])]));
  Object.keys(tt).forEach(k=>{if(ok.has(k)&&tt[k]!=null&&String(tt[k]).trim())out.t[k]=String(tt[k]).slice(0,2000)});
  if(Array.isArray(r.unsure))r.unsure.forEach(x=>{if(QID[x]&&!out.unsure.includes(x))out.unsure.push(x)});
  return out;
}
async function pdfToImages(f){
  if(!window.pdfjsLib)throw {code:'pdf'};
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
  for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p),vp=pg.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.88)));}
  return out;
}
async function runScan(cid){
  const files=[...($('scanf').files||[])],msg=$('scanmsg');
  if(!files.length){msg.textContent='בחר/י קודם את קובצי הסריקה או התמונות.';return;}
  $('scango').disabled=true;$('scanstop').hidden=false;
  try{
    msg.textContent='מכין את העמודים…';
    let imgs=[];for(const f of files){if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))imgs.push(...await pdfToImages(f));else imgs.push(f);}
    const per=Math.max(1,LIM.images.maxCount),batches=[];for(let i=0;i<imgs.length;i+=per)batches.push(imgs.slice(i,i+per));
    const merged={name:'',age:'',years:'',date:'',a:{},t:{},unsure:[]};
    for(let k=0;k<batches.length;k++){
      msg.textContent=`Claude קורא את הטופס${batches.length>1?` (חלק ${k+1} מתוך ${batches.length})`:''}… זה יכול לקחת כדקה.`;
      scanCtl=new AbortController();
      const r=cleanScan(await SAMPLE.json(scanPrompt(k,batches.length),{images:batches[k],modelTier:'complex',signal:scanCtl.signal,cache:false}));
      ['name','age','years','date'].forEach(x=>{if(!merged[x]&&r[x])merged[x]=r[x]});
      Object.assign(merged.a,Object.fromEntries(Object.entries(r.a).filter(([q])=>merged.a[q]==null)));
      Object.assign(merged.t,Object.fromEntries(Object.entries(r.t).filter(([q])=>!merged.t[q])));
      r.unsure.forEach(x=>{if(!merged.unsure.includes(x))merged.unsure.push(x)});
    }
    S={name:merged.name,age:merged.age,years:merged.years,date:merged.date||today(),a:merged.a,t:merged.t,unsure:merged.unsure,scanned:true,page:0,done:false,cid:cid||null};
    save();render();scrollTo(0,0);
  }catch(e){

  try{const out=[];for(const c of CLIENTS){const ev=await DB.collection(`clients/${c.id}/events`).orderBy('at','asc').limit(1000).get();out.push(Object.assign({},c,{events:ev.docs.map(x=>Object.assign({id:x.id},x.data()))}));}
    await DL.save({filename:'תיקי_נועצים_'+today().replace(/\./g,'-')+'.json',data:JSON.stringify({exported:Date.now(),clients:out},null,1)});m.textContent='';}
  catch(e){m.textContent=(e&&e.code)==='cancelled'||(e&&e.code)==='declined'?'':'הייצוא לא הצליח.';}
}
function renderYoetzHome(){
  $('app').innerHTML=brand('מסך יועץ/ת – ניתוח הפרופיל')+(DB?registryHTML()+'<h3>ניתוח מהיר, בלי תיק</h3>':'')+entryCards();
  if(DB)bindRegistry();
  bindEntryCards(null);
}
/* ---------- wording by the chosen gender, on every screen ----------
   G() turns "את/ה", "בחר/י" etc. into the chosen form. It is applied to the page's own text only
   (never to what the user typed), including parts that redraw when an answer reveals a follow-up. */
function cflGender(root){
  if(S.g!=='f'&&S.g!=='m')return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode&&n.parentNode.closest('textarea,script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{if(n.nodeValue.indexOf('/')>-1){const v=G(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}});
  (root.querySelectorAll?root.querySelectorAll('[placeholder]'):[]).forEach(el=>{const v=G(el.getAttribute('placeholder'));if(v!==el.getAttribute('placeholder'))el.setAttribute('placeholder',v);});
}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)cflGender(n);else if(n.nodeType===3&&n.parentNode)cflGender(n.parentNode);}))).observe(document.getElementById('app'),{childList:true,subtree:true});

/* ---------- sending to the site ---------- */
let SENT=null; /* once sent: { json, at, upd } – the answers as last sent, to spot unsent changes */
function cflState(){return {date:S.date||'',g:S.g||'',age:S.age||'',years:S.years||'',role:S.role||'',path:S.path||'',a:S.a,t:S.t,fbk:S.fbk||null};}
/* the answers in a fixed form (like the server keeps them), to compare what's on screen with what was sent */
function cflSort(o){if(Array.isArray(o))return o.map(cflSort);if(o&&typeof o==='object'){const r={};Object.keys(o).sort().forEach(k=>{if(o[k]!==undefined&&o[k]!==null)r[k]=cflSort(o[k])});return r}return o}
function cflCanon(d){d=d||{};const t={};Object.keys(d.t||{}).forEach(k=>{const s=String(d.t[k]==null?'':d.t[k]).trim();if(s)t[k]=s});
  return JSON.stringify(cflSort({date:String(d.date||'').trim(),age:String(d.age||'').trim(),years:String(d.years||'').trim(),role:String(d.role||'').trim(),path:String(d.path||'').trim(),a:d.a||{},t:t,fbk:d.fbk&&(d.fbk.agree||String(d.fbk.note||'').trim())?{agree:String(d.fbk.agree||''),note:String(d.fbk.note||'').trim()}:null}));}

function cflAfterEnd(){
  const send=$('cflSend'), card=send&&send.closest('.card'), edit=$('edit'), app=$('app');
  /* the "back to the answers" button lives in the send box in the original; keep it outside, so hiding the box keeps it */
  const nav=edit&&edit.closest('.nav');
  if(nav&&card&&card.contains(nav)){nav.style.marginTop='14px';card.after(nav);}
  if(LOCKED){ /* the יועצים view */
    if(card)card.style.display='none';
    if(edit)edit.style.display='none';
    app.querySelectorAll('.claybox').forEach(x=>x.remove());
    return;
  }
  if(SENT){
    const dirty=cflCanon(cflState())!==SENT.json;
    if(edit)edit.textContent='הסתכל בתשובות';
    if(card){card.style.display=dirty?'':'none';send.textContent='שליחת העדכון';}
    const old=app.querySelector('.cfl-sent'),n=CFL.sentNote(SENT.at,SENT.upd,dirty);
    if(old)old.replaceWith(n);else app.insertBefore(n,app.children[1]||null);
  }
  send.onclick=async()=>{
    if(!SENT&&!confirm('לשלוח את התשובות? אפשר יהיה לחזור אליהן ולעדכן אותן גם אחר כך.'))return;
    const label=send.textContent;send.disabled=true;send.textContent='שולח…';$('cflMsg').textContent='';
    const st=cflState();
    const r=await CFL.submit('intake',st,cwlReadable(pack()),{path:pathOf()});
    send.disabled=false;send.textContent=label;
    if(!r.ok){$('cflMsg').textContent=r.message||'השליחה לא הצליחה. נסו שוב.';return;}
    SENT={json:cflCanon(st),at:r.submittedAt||'',upd:r.updatedAt||''};
    renderEnd();scrollTo(0,0);
  };
}

/* "תשובות הנועץ" for the יועצים site: every section with the answers, read-only */
function renderAllAnswers(){
  const app=$('app');
  let h=brand('התשובות כפי שמולאו')+
    `<div class="card"><div class="qt" style="margin-bottom:6px">פרטי פתיחה</div>`+
    `<div class="qn"><b>גיל:</b> ${esc(S.age||'—')} · <b>שנות ניסיון מקצועי:</b> ${esc(S.years||'—')}</div>`+
    `<div class="qn"><b>תפקיד או עיסוק נוכחי:</b> ${esc(S.role||'—')}</div>`+
    `<div class="qn"><b>הפרק הכי משמעותי במסע המקצועי:</b> ${esc(S.path||'—')}</div></div>`;
  secs().forEach(sec=>{h+=`<h2>${esc(sec.title)}</h2>`;if(sec.intro)h+=`<p class="qn">${esc(sec.intro)}</p>`;sec.qs.forEach(q=>{h+=qHTML(q)});});
  app.innerHTML=h;
  app.querySelectorAll('input,textarea').forEach(e=>{e.readOnly=true;});
  app.style.pointerEvents='none';
}

CFL.start('intake').then(function(info){
  /* the לשון פניה chosen at signup: hides this page's own chooser and sets the wording */
  if(info.gender==='f'||info.gender==='m')HASHG=info.gender;
  if(info.view){
    S=Object.assign({name:'',date:'',a:{},t:{},page:0,done:true},info.saved||{},{name:CFL.name,done:true});
    LOCKED=true;
    if(info.viewMode==='answers')renderAllAnswers();else render();
    return;
  }
  KEY=CFL.draftKey('intake');
  if(info.status==='submitted'&&info.saved){
    /* sent before: open on the end screen; "הסתכל בתשובות" goes back to the answers for editing */
    SENT={json:cflCanon(info.saved),at:info.submittedAt||'',upd:info.updatedAt||''};
    let draft=null;try{draft=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
    if(draft&&cflCanon(draft)!==SENT.json){load();}  /* edits made here and not sent yet */
    else{S=Object.assign({name:'',date:'',a:{},t:{},page:0},info.saved,{done:true});}
    S.name=CFL.name;
    render();
    return;
  }
  load();
  S.name=CFL.name;
  render();
});
</script>

<script>
/* שאלון הכניסה: תשובות בטקסט קריא (לשליחה ליועצת) */
function cwlReadable(d){const a=d.a||{},t=d.t||{},L=[];
 if(d.age||d.years)L.push(`גיל: ${d.age||'-'} · שנות ניסיון: ${d.years||'-'}`);
 if((d.role||'').trim())L.push('מה אני עושה היום: '+d.role.trim());
 if((d.path||'').trim())L.push('הפרק הכי משמעותי במסע המקצועי: '+d.path.trim().replace(/\n+/g,' '));
 let lastN='';(typeof secs==='function'?secs():Q.sections).forEach(s=>{const rows=[];s.qs.forEach(q=>{if(q.showIf&&typeof condOK==='function'&&!condOK(q))return;let v='';const x=a[q.id];const num=q.key||(q.n?(lastN=String(q.n)):lastN+'ב');if(q.n&&!q.key)lastN=String(q.n);
  if(q.type==='grid'){const cols=(modeOf()==='A'&&q.colsA)||q.cols;const gl=gridRows(q).filter(([k])=>x&&x[k]!=null).map(([k,lab])=>`   • ${lab||'-'}: ${cols[x[k]]}`);if(gl.length)rows.push(`${num}. ${qtx(q)}\n`+gl.join('\n'));return;}
  const opt=i=>{const o=optsOf(q)[i]||'';return o+(q.other===i&&t[q.id+'_o']?(o.trim().endsWith(':')?' ':': ')+t[q.id+'_o']:'')};
  if(q.type==='single'&&x!=null)v=opt(x);
  else if(q.type==='multi'&&Array.isArray(x)&&x.length)v=x.map(opt).join(' | ');
  else if(q.type==='scale'&&x)v=`${x} מתוך 5 (1 = ${q.lo}, 5 = ${q.hi})`;
  else if(q.type==='open'&&(t[q.id]||'').trim())v=t[q.id].trim().replace(/\n+/g,' ');
  const fol=(q.follow&&q.follow.fields||[]).filter(f=>(t[f.id]||'').trim()).map(f=>`   • ${f.label} ${t[f.id].trim()}`);
  if(v||fol.length)rows.push(`${num}. ${qtx(q).split(/\s+/).slice(0,5).join(' ')}${qtx(q).split(/\s+/).length>5?'…':''}\n   ← ${v||'-'}${fol.length?'\n'+fol.join('\n'):''}`)});
  if(rows.length)L.push('\n'+s.title+'\n'+rows.join('\n'))});
 if(AUTO_REFL){const x=autoReflText(d);if(x)L.push(x);}
 const F={yes:'אני מסכים/ה עם התיאור',partly:'התיאור נכון בחלקו, אבל אינו חד דיו',no:'אני לא מסכים/ה עם התיאור'};
 if(d.fbk&&(d.fbk.agree||(d.fbk.note||'').trim())){L.push('\nהתגובה שלי לתמונת הפתיחה');if(d.fbk.agree)L.push('איך התיאור מרגיש לי: '+F[d.fbk.agree]);if((d.fbk.note||'').trim())L.push('מה רציתי להוסיף: '+d.fbk.note.trim().replace(/\n+/g,' '));}
 return L.join('\n');}
</script>
